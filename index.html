<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>&N LP Workspace</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
    background: #0d0d0d;
    color: #e8e8e8;
    display: grid;
    place-items: center;
    padding: 40px 24px;
    line-height: 1.7;
  }
  main { max-width: 680px; width: 100%; }
  .brand {
    font-size: 14px;
    letter-spacing: 2px;
    color: #c9a84c;
    font-weight: 700;
    margin-bottom: 12px;
    text-transform: uppercase;
  }
  h1 {
    font-size: clamp(28px, 5vw, 40px);
    font-weight: 800;
    letter-spacing: -0.01em;
    margin-bottom: 20px;
    color: #fff;
  }
  p { color: #b8b8b8; margin-bottom: 32px; font-size: 15px; }
  .grid { display: grid; gap: 16px; }
  .card {
    display: block;
    padding: 22px 24px;
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-left: 3px solid #c9a84c;
    border-radius: 10px;
    color: #fff;
    text-decoration: none;
    transition: border-color .2s, transform .2s;
  }
  .card:hover { border-color: #c9a84c; transform: translateX(4px); }
  .card-title { font-size: 17px; font-weight: 700; margin-bottom: 6px; }
  .card-desc { font-size: 13px; color: #888; }
  .card-status {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 10px;
    border-radius: 4px;
    margin-left: 8px;
    vertical-align: middle;
    letter-spacing: 0.5px;
  }
  .status-wip { background: #2a2a2a; color: #c9a84c; }
  .status-live { background: #c9a84c; color: #1a1a1a; }
  footer { margin-top: 48px; font-size: 12px; color: #555; }
</style>
</head>
<body>
<main>
  <div class="brand">Private Salon &amp;N</div>
  <h1>LP Workspace</h1>
  <p>渋谷・男性専門脱毛サロン &N のランディングページ制作ワークスペースです。<br>作業中のLPは以下からアクセスできます。</p>

  <div class="grid">
    <a class="card" href="./hige/">
      <div class="card-title">髭脱毛LP<span class="card-status status-wip">制作中</span></div>
      <div class="card-desc">40〜50代男性向け / Meta広告用 / 白髪ラストチャンス訴求</div>
    </a>
  </div>

  <footer>
    Last updated: 2026-04-15 / Repository: viviwood327/test
  </footer>
</main>
</body>
</html>
